<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinicagen — Medical AI Assistant</title>
  <meta name="description" content="Clinicagen - Conversational medical ML analysis system for diabetes risk assessment." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=2.0" />
</head>
<body>
  <div class="app-layout">
    <!-- Left Sidebar (ChatGPT Deep Charcoal #171717) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" id="new-chat-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          New chat
        </button>
        <button class="sidebar-toggle-btn" id="sidebar-close-btn" aria-label="Close sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
        </button>
      </div>

      <nav class="history-container">
        <!-- History list removed -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="profile-avatar" style="background-color: var(--text-muted);">U</div>
          <span class="profile-name">User Profile</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Navigation -->
      <header class="top-nav">
        <button class="sidebar-toggle-btn" id="sidebar-open-btn" aria-label="Open sidebar" style="display: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
        </button>
        <div class="model-selector">
          <span class="model-name">Chat</span>
        </div>
        <div style="width: 18px;"></div> <!-- Spacer to center the title -->
      </header>

      <!-- Chat Interface -->
      <section class="chat-wrapper">
        <div class="chat-history" id="chat-history" aria-live="polite">
          <!-- Chat list messages or suggestions grid injected here by app.js -->
        </div>

        <!-- Typing indicator hidden by default -->
        <div id="typing-indicator" class="typing-indicator" hidden>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>

        <!-- Input Area (ChatGPT Style Floating Centered) -->
        <div class="input-panel">
          <div class="input-inner">
            <form id="chat-form" class="chat-form">
              <input type="text" id="chat-input" class="chat-input" placeholder="Message Clinicagen..." autocomplete="off" required />
              <button type="submit" class="send-btn" id="send-btn" aria-label="Send message">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
              </button>
            </form>
          </div>
          <div class="disclaimer-footer">
            Clinicagen provides AI educational explanations of ML outcomes. Verify important health metrics with a licensed practitioner.
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js?v=2.0"></script>
</body>
</html>
